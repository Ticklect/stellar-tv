name: Bug report
description: Report a reproducible problem with the Tizen or Android TV build
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search existing issues first and remove serial numbers, local IP addresses, cookies, signed media URLs, and other sensitive data.

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Samsung Tizen / TizenBrew
        - Android TV / Google TV
    validations:
      required: true

  - type: input
    id: tv-model
    attributes:
      label: TV or streaming-device model
      description: Give the model code, but never the serial number.
    validations:
      required: true

  - type: input
    id: platform-version
    attributes:
      label: Platform and host version
      description: Include Tizen and TizenBrew versions, or Android and Android System WebView versions. Write "Unknown" where necessary.
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App or module version
      description: Include the exact TizenBrew GitHub identifier or Android version name when possible.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal numbered sequence starting from app/module launch.
      placeholder: |
        1. Launch Goated TV
        2. Press ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or errors
      description: Paste redacted errors or the redacted diagnostics object. Use a code block when possible.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Optional. Drag files here after removing personal and device-identifying information.

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      options:
        - Every time
        - Sometimes
        - Once
        - Unknown
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets, cookies, signed URLs, serial numbers, and private network details.
          required: true
        - label: This is not a sensitive security vulnerability.
          required: true
