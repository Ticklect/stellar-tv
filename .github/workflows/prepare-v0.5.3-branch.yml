name: Prepare Stellar v0.5.3 launcher assets

on:
  push:
    branches:
      - release-v0.5.3-2

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[prepared-icon]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release-v0.5.3-2

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate exact launcher mipmaps
        run: python scripts/prepare-stellar-icons.py

      - name: Point Android manifest at Stellar mipmaps
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android-tv/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          text = text.replace('android:icon="@drawable/stellar_app_icon"', 'android:icon="@mipmap/stellar_launcher"')
          text = text.replace('android:roundIcon="@drawable/stellar_app_icon"', 'android:roundIcon="@mipmap/stellar_launcher_round"')
          p.write_text(text)
          PY

      - name: Verify generated artwork
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for density, size in expected.items():
              for name in ('stellar_launcher.png', 'stellar_launcher_round.png'):
                  path = Path(f'android-tv/app/src/main/res/mipmap-{density}/{name}')
                  assert path.exists(), path
                  with Image.open(path) as im:
                      assert im.size == (size, size), (path, im.size)
          manifest = Path('android-tv/app/src/main/AndroidManifest.xml').read_text()
          assert 'android:icon="@mipmap/stellar_launcher"' in manifest
          assert 'android:roundIcon="@mipmap/stellar_launcher_round"' in manifest
          print('Exact Stellar launcher mipmaps verified.')
          PY

      - name: Commit prepared launcher assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-tv/app/src/main/AndroidManifest.xml \
                  android-tv/app/src/main/res/drawable-nodpi/stellar_app_icon.png \
                  android-tv/app/src/main/res/mipmap-mdpi \
                  android-tv/app/src/main/res/mipmap-hdpi \
                  android-tv/app/src/main/res/mipmap-xhdpi \
                  android-tv/app/src/main/res/mipmap-xxhdpi \
                  android-tv/app/src/main/res/mipmap-xxxhdpi
          if git diff --cached --quiet; then
            echo "Launcher assets are already prepared."
            exit 0
          fi
          git commit -m "android: install exact Stellar launcher artwork [prepared-icon]"
          git push origin HEAD:release-v0.5.3-2
