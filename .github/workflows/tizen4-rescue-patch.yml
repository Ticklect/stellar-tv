name: Apply Tizen 4 rescue patch

on:
  push:
    branches:
      - fix/tizen4-ad-compat
    paths:
      - .github/workflows/tizen4-rescue-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/tizen4-ad-compat
          fetch-depth: 0

      - name: Apply rescue implementation
        run: python3 scripts/apply-tizen4-rescue.py

      - name: Format and validate Node/Tizen code
        run: |
          npm ci
          npx prettier --write main.js
          npm run validate

      - name: Commit rescue implementation
        run: |
          rm .github/workflows/tizen4-rescue-patch.yml scripts/apply-tizen4-rescue.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js .github/workflows/tizen4-rescue-patch.yml scripts/apply-tizen4-rescue.py
          git commit -m "fix: add Tizen 4 rescue mode"
          git push origin HEAD:fix/tizen4-ad-compat
