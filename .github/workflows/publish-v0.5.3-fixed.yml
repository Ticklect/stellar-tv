name: Publish Stellar TV v0.5.3 (fixed icon)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish signed v0.5.3
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.GOATED_ANDROID_KEYSTORE_BASE64 }}
      GOATED_ANDROID_STORE_PASSWORD: ${{ secrets.GOATED_ANDROID_STORE_PASSWORD }}
      GOATED_ANDROID_KEY_ALIAS: ${{ secrets.GOATED_ANDROID_KEY_ALIAS }}
      GOATED_ANDROID_KEY_PASSWORD: ${{ secrets.GOATED_ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip if release already exists
        id: release
        run: |
          if gh release view v0.5.3 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.release.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate source and version
        if: steps.release.outputs.exists != 'true'
        run: |
          test "$(node -p 'require("./package.json").version')" = "0.5.3"
          npm ci
          npm run validate

      - name: Package TizenBrew
        if: steps.release.outputs.exists != 'true'
        run: |
          mkdir -p dist
          zip -r "dist/stellar-tizenbrew-v0.5.3.zip" \
            package.json main.js app LICENSE LICENSE.GPL README.md CHANGELOG.md THIRD_PARTY_NOTICES.md

      - name: Set up Java
        if: steps.release.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        if: steps.release.outputs.exists != 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        if: steps.release.outputs.exists != 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare exact supplied Stellar icon
        if: steps.release.outputs.exists != 'true'
        run: |
          python -m pip install --disable-pip-version-check pillow
          python scripts/prepare-stellar-icons.py

      - name: Require and decode release signing key
        if: steps.release.outputs.exists != 'true'
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$GOATED_ANDROID_STORE_PASSWORD"
          test -n "$GOATED_ANDROID_KEY_ALIAS"
          test -n "$GOATED_ANDROID_KEY_PASSWORD"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stellar-release.jks"
          echo "GOATED_ANDROID_KEYSTORE=$RUNNER_TEMP/stellar-release.jks" >> "$GITHUB_ENV"

      - name: Test, lint, and build signed Android release
        if: steps.release.outputs.exists != 'true'
        working-directory: android-tv
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease

      - name: Prepare signed APK
        if: steps.release.outputs.exists != 'true'
        run: |
          APK="$(find android-tv/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          test -n "$APK"
          case "$APK" in
            *-unsigned.apk) echo "Release APK is unsigned" >&2; exit 1 ;;
          esac
          cp "$APK" "dist/stellar-android-tv-v0.5.3.apk"
          sha256sum dist/stellar-android-tv-v0.5.3.apk dist/stellar-tizenbrew-v0.5.3.zip | tee dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: steps.release.outputs.exists != 'true'
        run: |
          gh release create v0.5.3 \
            dist/stellar-android-tv-v0.5.3.apk \
            dist/stellar-tizenbrew-v0.5.3.zip \
            dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Stellar TV v0.5.3" \
            --notes "Stellar TV v0.5.3 updates the TizenBrew and Android TV compatibility layer for https://stellar.gdn/.\n\n- Rebrands the TV app from Goated to Stellar.\n- Uses the exact supplied Stellar star-and-orbit artwork as the Android launcher icon.\n- Keeps the existing Android package ID and signing identity so signed installs can update in place.\n- Updates repository and install links to Ticklect/stellar-tv.\n- Includes signed Android TV APK and TizenBrew ZIP.\n\nTizenBrew: Ticklect/stellar-tv@0.5.3"
