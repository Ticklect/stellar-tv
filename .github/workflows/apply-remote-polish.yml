name: Apply remote polish patch

on:
  push:
    branches:
      - agent/remote-polish-2026-09-15
    paths:
      - scripts/apply-remote-polish.mjs
      - .github/workflows/apply-remote-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply focused runtime fixes
        run: node scripts/apply-remote-polish.mjs

      - name: Verify patch is clean
        run: git diff --check

      - name: Commit runtime fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js android-tv/app/src/main/java/io/github/ticklect/goatedtv/MainActivity.kt test/remote-polish.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: harden physical TV remote navigation"
          git push origin HEAD:${{ github.ref_name }}
