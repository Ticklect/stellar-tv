name: Apply remote Back polish

on:
  push:
    branches:
      - agent/remote-polish-2026-09-15
    paths:
      - scripts/apply-remote-back-polish.mjs
      - .github/workflows/apply-remote-back-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused Back fix
        run: node scripts/apply-remote-back-polish.mjs

      - name: Format changed sources
        run: npm run format

      - name: Run browser-side validation
        run: npm run lint && npm test

      - name: Verify patch is clean
        run: git diff --check

      - name: Commit runtime fix and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js test/remote-polish.test.mjs test/remote-player-controls.test.mjs test/remote-back.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "fix: polish Back focus recovery"
          git push origin HEAD:${{ github.ref_name }}
