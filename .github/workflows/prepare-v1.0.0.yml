name: Prepare Stellar TV v1.0.0

on:
  push:
    branches:
      - release-v1.0.0

permissions:
  contents: write

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[prepared-v1]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release-v1.0.0

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Prepare v1.0.0 source, artwork, and metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          from PIL import Image

          root = Path('.')

          package = json.loads((root / 'package.json').read_text())
          package['version'] = '1.0.0'
          (root / 'package.json').write_text(json.dumps(package, indent=2) + '\n')

          lock_path = root / 'package-lock.json'
          lock = json.loads(lock_path.read_text())
          lock['version'] = '1.0.0'
          lock['packages']['']['version'] = '1.0.0'
          lock_path.write_text(json.dumps(lock, indent=2) + '\n')

          main_path = root / 'main.js'
          main = main_path.read_text()
          main = main.replace("var MODULE_VERSION = '0.5.3';", "var MODULE_VERSION = '1.0.0';")
          main_path.write_text(main)

          gradle_path = root / 'android-tv/app/build.gradle.kts'
          gradle = gradle_path.read_text()
          gradle = gradle.replace('val appVersion = "0.5.3"', 'val appVersion = "1.0.0"')
          gradle = gradle.replace('versionCode = 8', 'versionCode = 9')
          gradle_path.write_text(gradle)

          # The current xhdpi launcher is byte-for-byte the 96x96 LANCZOS resize
          # of the exact artwork supplied for v1.0.0. Use that known-good PNG
          # rather than routing binary image data through a text file.
          seed = root / 'android-tv/app/src/main/res/mipmap-xhdpi/ic_launcher.png'
          seed_bytes = seed.read_bytes()
          seed_digest = hashlib.sha256(seed_bytes).hexdigest()
          expected_digest = '9b2ea8ddb1ea6af041f3583f1bea6c005c25fb348defa435baf551009550f217'
          if seed_digest != expected_digest:
              raise SystemExit(f'Unexpected Stellar launcher seed: {seed_digest}')

          source = root / 'android-tv/app/src/main/res/drawable-nodpi/stellar_app_icon.png'
          source.parent.mkdir(parents=True, exist_ok=True)
          source.write_bytes(seed_bytes)

          image = Image.open(source).convert('RGB')
          expected = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for density, size in expected.items():
              folder = root / f'android-tv/app/src/main/res/mipmap-{density}'
              folder.mkdir(parents=True, exist_ok=True)
              resized = image.resize((size, size), Image.Resampling.LANCZOS)
              resized.save(folder / 'ic_launcher.png', format='PNG', optimize=True)
              resized.save(folder / 'ic_launcher_round.png', format='PNG', optimize=True)

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text()
          changelog = changelog.replace(
              'and the project uses [Semantic Versioning](https://semver.org/spec/v2.0.0.html) while the public API remains pre-1.0.',
              'and the project uses [Semantic Versioning](https://semver.org/spec/v2.0.0.html).'
          )
          marker = '## [Unreleased]\n'
          section = '''## [1.0.0] - 2026-09-08\n\n### Changed\n\n- First stable Stellar TV release for `https://stellar.gdn/`.\n- Uses the supplied Stellar star-and-orbit artwork as the canonical Android TV launcher icon.\n- Synchronizes the TizenBrew package and Android TV app at version `1.0.0`.\n- Removes the temporary v0.5.3 icon-repair and release workflows.\n\n'''
          if '## [1.0.0]' not in changelog:
              changelog = changelog.replace(marker, marker + '\n' + section)
          changelog_path.write_text(changelog)

          for path in [root / 'README.md', root / 'android-tv/README.md']:
              if path.exists():
                  text = path.read_text()
                  text = text.replace('v0.5.3', 'v1.0.0').replace('0.5.3', '1.0.0')
                  path.write_text(text)

          test_path = root / 'test/android-launcher-icon.test.mjs'
          test_path.write_text('''import assert from \'node:assert/strict\';\nimport { createHash } from \'node:crypto\';\nimport fs from \'node:fs\';\nimport test from \'node:test\';\n\nconst read = (path) => fs.readFileSync(new URL(path, import.meta.url), \'utf8\');\n\ntest(\'Android launcher uses the supplied Stellar artwork\', () => {\n  const manifest = read(\'../android-tv/app/src/main/AndroidManifest.xml\');\n  const source = fs.readFileSync(\n    new URL(\'../android-tv/app/src/main/res/drawable-nodpi/stellar_app_icon.png\', import.meta.url)\n  );\n  const digest = createHash(\'sha256\').update(source).digest(\'hex\');\n\n  assert.equal(digest, \'9b2ea8ddb1ea6af041f3583f1bea6c005c25fb348defa435baf551009550f217\');\n  assert.match(manifest, /android:icon="@mipmap\\/ic_launcher"/);\n  assert.match(manifest, /android:roundIcon="@mipmap\\/ic_launcher_round"/);\n});\n''')

          for stale in [
              '.github/workflows/prepare-v0.5.3-branch.yml',
              '.github/workflows/publish-v0.5.3.yml',
              '.github/workflows/publish-v0.5.3-fixed.yml',
              'android-tv/app/src/release/AndroidManifest.xml',
              'scripts/prepare-stellar-icons.py',
              '.stellar-v1-icon.b64',
              '.github/workflows/prepare-v1.0.0.yml',
          ]:
              path = root / stale
              if path.exists():
                  path.unlink()
          PY

      - name: Format and verify source
        run: |
          npm ci
          npx prettier --write package.json package-lock.json CHANGELOG.md README.md android-tv/README.md test/android-launcher-icon.test.mjs test/release-metadata.test.mjs
          npm run validate

      - name: Commit prepared v1.0.0 release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Stellar TV v1.0.0 [prepared-v1]"
          git push origin HEAD:release-v1.0.0
