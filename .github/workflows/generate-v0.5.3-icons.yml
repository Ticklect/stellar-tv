name: Generate v0.5.3 launcher icons

on:
  push:
    branches:
      - release-v0.5.3

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release-v0.5.3
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Generate Android launcher densities from supplied Stellar artwork
        shell: python
        run: |
          from pathlib import Path
          from PIL import Image

          source = Path('android-tv/app/src/main/res/drawable-nodpi/stellar_app_icon.png')
          image = Image.open(source).convert('RGBA')
          sizes = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }
          for density, pixels in sizes.items():
              target_dir = Path(f'android-tv/app/src/main/res/mipmap-{density}')
              target_dir.mkdir(parents=True, exist_ok=True)
              resized = image.resize((pixels, pixels), Image.Resampling.LANCZOS)
              resized.save(target_dir / 'ic_launcher.png', 'PNG', optimize=True)
              resized.save(target_dir / 'ic_launcher_round.png', 'PNG', optimize=True)

      - name: Commit generated launcher icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-tv/app/src/main/res/mipmap-*/ic_launcher*.png
          git commit -m "Generate Stellar Android launcher icon sizes"
          git push origin HEAD:release-v0.5.3
